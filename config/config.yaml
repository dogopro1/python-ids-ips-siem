interface: "auto"
dos_threshold: 100
portscan_threshold: 20
syn_flood_threshold: 80
icmp_flood_threshold: 50
time_window: 10
blacklist:
  - "1.2.3.4"
  - "5.6.7.8"
suspicious_ports:
  - 4444
  - 5555
  - 6666
  - 31337
  - 12345
ips_enabled: true
block_timeout: 600
web_host: "127.0.0.1"
web_port: 5000
log_file: "logs/system.log"
log_level: "INFO"
packet_buffer_size: 1000
